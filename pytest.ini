[pytest]
; 测试文件搜索路径（v2.0：测试代码在 src/wdclaude 下；.wdclaude/tests 为项目测试资产）
testpaths = src .wdclaude/tests

; 测试文件命名规范
python_files = test_*.py

; 测试类命名规范
python_classes = Test*

; 测试函数命名规范
python_functions = test_*

; 默认命令行参数：详细输出 + 简短错误追溯
addopts = -v --tb=short

; 忽略目录（v2.0：避免搜索运行数据/构建产物等无关目录）
norecursedirs = .git venv .venv env .idea __pycache__ build dist .wdclaude/log .wdclaude/memory_storage .wdclaude/tmp_output .wdclaude/token_statistics .wdclaude/cache
